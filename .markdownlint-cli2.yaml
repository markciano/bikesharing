# Markdown lint: single source of scope and rules (reasons in docs/testing-strategy.md › Docs).
# The scope is mirrored in `paths:` of .claude/rules/docs/general.md (Claude Code cannot read this file); keep both in sync.
globs:
  - "*.md"
  - "docs/**/*.md"
  - ".claude/**/*.md"
  - "spikes/**/*.md"
gitignore: true # skips node_modules/, venv/ and anything else Git ignores
# Default rules except the ones listed; cosmetic ones are fixed with --fix.
config:
  default: true
  MD013: false # line length
  MD024: # duplicate headings: allowed under different parents
    siblings_only: true
  MD060: false # table column style
