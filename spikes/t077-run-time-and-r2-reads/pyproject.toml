[project]
name = "t077-run-time-and-r2-reads"
version = "0.1.0"
requires-python = "==3.14.9"
dependencies = [
    "bikesharing",
    "boto3>=1.44.11",
]

[tool.uv]
# The probes measure the production reader: this lock resolves on its own, so deltalake
# is held to the version pipeline/uv.lock locks.
constraint-dependencies = ["deltalake==1.6.6"]

[tool.uv.sources]
bikesharing = { path = "../../pipeline" }
