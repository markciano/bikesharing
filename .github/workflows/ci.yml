name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # TODO: when the second component job is added, add a final job `ci-passed`
  # that needs all jobs, and switch the ruleset's required check from `docs`
  # to `ci-passed` (ADR-0013).
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: bash scripts/lint-docs.sh