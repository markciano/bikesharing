name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      capture: ${{ steps.filter.outputs.capture }}
      pipeline: ${{ steps.filter.outputs.pipeline }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            capture:
              - 'capture/**'
              - 'contracts/**'
              - '.github/workflows/ci.yml'
            pipeline:
              - 'pipeline/**'
              - 'contracts/bronze-keys.json'
              - 'contracts/latest-station-count.schema.json'
              - 'contracts/latest-station-count.json'
              - '.github/workflows/ci.yml'

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: bash scripts/lint-docs.sh

  capture:
    needs: changes
    if: needs.changes.outputs.capture == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: capture
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: capture/.nvmrc
          cache: npm
          cache-dependency-path: capture/package-lock.json
      - run: npm ci
      - run: npx vitest run

  pipeline:
    needs: changes
    if: needs.changes.outputs.pipeline == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
      # uv installs the Python of pipeline/.python-version.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: bash scripts/check-pipeline.sh

  # The only required check. `if: always()` keeps it from being skipped when a
  # job fails; a job skipped by its path filter passes.
  ci-passed:
    needs: [changes, docs, capture, pipeline]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1