name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # TODO: when the second component job is added, add a final job `ci-passed`
  # that needs all jobs, and switch the ruleset's required check from `docs`
  # to `ci-passed` (ADR-0013).
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "docs/**/*.md"

  # TODO: temporary (spike s008): remove at Conclusion.
  poc-spark:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spikes/testing-conventions/spark
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -r requirements.txt
      - run: pytest

  # TODO: temporary (spike s008): remove at Conclusion.
  poc-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spikes/testing-conventions/worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: spikes/testing-conventions/worker/package.json
      - run: npm ci
      - run: npx vitest run
