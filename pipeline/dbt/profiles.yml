# The run's scratch database: a DuckDB file in the run's work folder, sandboxed to
# that folder and with its memory bounded (d008, Bronze reading). The shell sets
# the four variables from the run's paths and DuckDB's memory limit.
bikesharing:
  target: run
  outputs:
    run:
      type: duckdb
      path: "{{ env_var('BIKESHARING_SCRATCH_DATABASE') }}"
      # The plugin applies the sandbox once, on the database's connection: the
      # profile's own settings would be applied again on every cursor, which the
      # locked sandbox refuses (d008 DI6).
      plugins:
        - module: bikesharing.shell.duckdb_session
          config:
            memory_limit: "{{ env_var('BIKESHARING_MEMORY_LIMIT') }}"
            temp_directory: "{{ env_var('BIKESHARING_TEMP_DIRECTORY') }}"
            allowed_directory: "{{ env_var('BIKESHARING_ALLOWED_DIRECTORY') }}"
