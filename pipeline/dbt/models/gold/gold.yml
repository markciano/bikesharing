models:
  - name: latest_station_count
    description: >-
      The latest count of each station of both systems, in the shape of the published
      file `latest-station-count.json` (d008 D2, Published file: the latest count of
      each station). It reads the rows of each system's latest capture, so a station the
      feed stops listing is not in it.
    config: {materialized: view, contract: {enforced: true}}
    columns:
      - name: system
        data_type: varchar
        description: The bike sharing system, `ambici` or `bicing`.
      - name: station_id
        data_type: varchar
        description: The station's ID in its system.
      - name: num_vehicles_available
        data_type: integer
        description: Vehicles available to rent; null at an out-of-service Bicing station (TR9).
      - name: num_docks_available
        data_type: integer
        description: Docks available to return a vehicle.
      - name: is_renting
        data_type: boolean
        description: Whether the station rents vehicles, as published.
      - name: is_returning
        data_type: boolean
        description: Whether the station accepts returns, as published.
      - name: last_reported
        data_type: timestamp with time zone
        description: The station's last report instant, in UTC, as published.
      - name: captured_at
        data_type: timestamp with time zone
        description: The instant of the capture the count comes from, in UTC.

unit_tests:
  # Verifies d008 R6
  - name: latest_station_count_holds_the_fields_of_the_published_file
    description: >-
      Each row of the latest captures of both systems is a row of the file with its
      count, flags and instants: the same station ID in both systems are two rows,
      each with the capture instant of its own system.
    model: latest_station_count
    given:
      - input: source('lakehouse', 'latest_captures')
        format: sql
        rows: |
          select
              'ambici' as system,
              '1' as station_id,
              '2026-10-19 08:57:45+00'::timestamptz as captured_at,
              '2026-10-19'::date as local_date,
              637::smallint as local_minute,
              5::integer as num_vehicles_available,
              10::integer as num_docks_available,
              null::integer as num_vehicles_disabled,
              null::integer as num_docks_disabled,
              true as is_installed,
              true as is_renting,
              true as is_returning,
              '2026-10-19 08:55:00+00'::timestamptz as last_reported,
              '2026-10-19 08:56:58+00'::timestamptz as last_updated,
              'run-0' as run_id,
              'check' as code_version
          union all
          select
              'bicing' as system,
              '1' as station_id,
              '2026-10-19 08:57:30+00'::timestamptz as captured_at,
              '2026-10-19'::date as local_date,
              637::smallint as local_minute,
              3::integer as num_vehicles_available,
              7::integer as num_docks_available,
              1::integer as num_vehicles_disabled,
              0::integer as num_docks_disabled,
              true as is_installed,
              true as is_renting,
              false as is_returning,
              '2026-10-19 08:56:12.125+00'::timestamptz as last_reported,
              '2026-10-19 08:57:25+00'::timestamptz as last_updated,
              'run-0' as run_id,
              'check' as code_version
    expect:
      rows:
        - {system: ambici, station_id: "1", captured_at: "2026-10-19 08:57:45+00",
           num_vehicles_available: 5, num_docks_available: 10,
           is_renting: true, is_returning: true,
           last_reported: "2026-10-19 08:55:00+00"}
        - {system: bicing, station_id: "1", captured_at: "2026-10-19 08:57:30+00",
           num_vehicles_available: 3, num_docks_available: 7,
           is_renting: true, is_returning: false,
           last_reported: "2026-10-19 08:56:12.125+00"}

  # Verifies TR9, d008 R6
  - name: latest_station_count_keeps_an_unknown_vehicle_count_null
    description: >-
      A station out of service, whose vehicle count the feed does not publish, stays
      in the file with a null count, never as 0.
    model: latest_station_count
    given:
      - input: source('lakehouse', 'latest_captures')
        format: sql
        rows: |
          select
              'bicing' as system,
              '2' as station_id,
              '2026-10-19 08:57:30+00'::timestamptz as captured_at,
              null::integer as num_vehicles_available,
              0::integer as num_docks_available,
              false as is_renting,
              false as is_returning,
              '2025-10-16 06:18:25.125+00'::timestamptz as last_reported
    expect:
      rows:
        - {system: bicing, station_id: "2", captured_at: "2026-10-19 08:57:30+00",
           num_vehicles_available: null, num_docks_available: 0,
           is_renting: false, is_returning: false,
           last_reported: "2025-10-16 06:18:25.125+00"}
