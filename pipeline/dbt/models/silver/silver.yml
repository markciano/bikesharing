# Silver models: each system's staging model and, unioned, the station stock
# (d008, Transformation in dbt).
models:
  - name: stg_ambici__station_status
    description: >-
      AMBici's station status, one row per station and capture: its fields cast,
      its instants converted from POSIX seconds to UTC, its measures named as GBFS
      3.0 names them, and null as the disabled counts AMBici does not publish
      (TR5–TR8, TR53).
    columns: &staging_columns
      - name: system
        description: The bike sharing system, taken from the object's bronze key.
      - name: station_id
        description: The station's ID in its system.
      - name: captured_at
        description: The capture instant, in UTC, taken from the object's bronze key.
      - name: num_vehicles_available
        description: >-
          Vehicles available to rent, as published (TR10); null at an out-of-service
          Bicing station (TR9).
      - name: num_docks_available
        description: Docks available to return a vehicle, as published.
      - name: num_vehicles_disabled
        description: Vehicles that cannot be rented, as published; null for AMBici (TR8).
      - name: num_docks_disabled
        description: Docks that cannot be used, as published; null for AMBici (TR8).
      - name: is_installed
        description: Whether the station is installed, as published (TR6).
      - name: is_renting
        description: Whether the station rents vehicles, as published (TR6).
      - name: is_returning
        description: Whether the station accepts returns, as published (TR6).
      - name: last_reported
        description: The station's last report instant, in UTC, as published (TR7).
      - name: last_updated
        description: The response's publication instant, in UTC (TR53).

  - name: stg_bicing__station_status
    description: >-
      Bicing's station status, one row per station and capture: its fields cast, its
      RFC 3339 instants converted to UTC, and null as the vehicles available at a
      station out of service (TR6–TR10, TR53).
    columns: *staging_columns

  - name: station_stock
    description: >-
      The station stock of both systems, one row per station and capture (TR1), with
      its measures and flags as each system's staging model holds them, its local
      calendar keys and the run's ID and code version as lineage.
    config:
      materialized: table
      contract: {enforced: true}
    data_tests:
      - unique_combination_of_columns:
          name: DQR1
          arguments:
            combination_of_columns: [system, station_id, captured_at]
          config:
            severity: error
            meta:
              catalog_entry: docs/data-quality.md#facts
      - count_matches_listed_items:
          name: DQR13
          arguments:
            sources:
              - source('ambici', 'station_status')
              - source('bicing', 'station_status')
            items: data.stations
          config:
            severity: error
            meta:
              catalog_entry: docs/data-quality.md#runs-and-published-files
    columns:
      - name: system
        description: The bike sharing system, taken from the object's bronze key.
        data_type: varchar
        constraints: [{type: not_null}]
      - name: station_id
        description: The station's ID in its system.
        data_type: varchar
        constraints: [{type: not_null}]
      - name: captured_at
        description: The capture instant, in UTC, taken from the object's bronze key.
        data_type: timestamp with time zone
        constraints: [{type: not_null}]
      - name: local_date
        description: The date of `captured_at` in `Europe/Madrid` (ADR-0041).
        data_type: date
        constraints: [{type: not_null}]
      - name: local_minute
        description: >-
          The minute of the day, 0 to 1439, of `captured_at` in `Europe/Madrid`
          (ADR-0041).
        data_type: smallint
        constraints: [{type: not_null}]
      - name: num_vehicles_available
        description: >-
          Vehicles available to rent, as published (TR10); null at an out-of-service
          Bicing station (TR9).
        data_type: integer
      - name: num_docks_available
        description: Docks available to return a vehicle, as published.
        data_type: integer
      - name: num_vehicles_disabled
        description: Vehicles that cannot be rented, as published; null for AMBici (TR8).
        data_type: integer
      - name: num_docks_disabled
        description: Docks that cannot be used, as published; null for AMBici (TR8).
        data_type: integer
      - name: is_installed
        description: Whether the station is installed, as published (TR6).
        data_type: boolean
        constraints: [{type: not_null}]
      - name: is_renting
        description: Whether the station rents vehicles, as published (TR6).
        data_type: boolean
        constraints: [{type: not_null}]
      - name: is_returning
        description: Whether the station accepts returns, as published (TR6).
        data_type: boolean
        constraints: [{type: not_null}]
      - name: last_reported
        description: The station's last report instant, in UTC, as published (TR7).
        data_type: timestamp with time zone
        constraints: [{type: not_null}]
      - name: last_updated
        description: The response's publication instant, in UTC (TR53).
        data_type: timestamp with time zone
        constraints: [{type: not_null}]
      - name: run_id
        description: The ID of the run that wrote the row (ADR-0043).
        data_type: varchar
        constraints: [{type: not_null}]
      - name: code_version
        description: The code version of the run that wrote the row (ADR-0043).
        data_type: varchar
        constraints: [{type: not_null}]

  - name: capture_volume
    description: >-
      Each capture of the batch against the median number of stations of its system's
      captures in the 24 h before it, from the history and the batch's own earlier
      captures: the audit of DQR12, and the station count the shell records per
      object.
    config:
      contract: {enforced: true}
    data_tests:
      - has_no_rows:
          name: DQR12
          config:
            severity: warn
            where: "status = 'drop'"
            meta:
              catalog_entry: docs/data-quality.md#runs-and-published-files
    columns:
      - name: system
        description: The bike sharing system, taken from the object's bronze key.
        data_type: varchar
      - name: captured_at
        description: The capture instant, in UTC, taken from the object's bronze key.
        data_type: timestamp with time zone
      - name: station_count
        description: The number of stations the capture lists; 0 if none.
        data_type: integer
      - name: captures_in_window
        description: The captures of its system in the 24 h before the capture.
        data_type: integer
      - name: median_station_count
        description: >-
          The median `station_count` of those captures; null if there are none.
        data_type: double
      - name: status
        description: >-
          `drop` below 90% of the median, `not_evaluated` with fewer than 60 captures
          in the window, `ok` otherwise.
        data_type: varchar

  - name: schema_drift
    description: >-
      The fields each bronze object of the batch adds to or drops from its system's
      read schema, one row per field: the audit of DQR11.
    config:
      contract: {enforced: true}
    data_tests:
      - has_no_rows:
          name: DQR11
          config:
            severity: warn
            meta:
              catalog_entry: docs/data-quality.md#runs-and-published-files
    columns:
      - name: system
        description: The bike sharing system, taken from the object's bronze key.
        data_type: varchar
      - name: captured_at
        description: The capture instant, in UTC, taken from the object's bronze key.
        data_type: timestamp with time zone
      - name: field
        description: The station field added or dropped.
        data_type: varchar
      - name: change
        description: >-
          `added` for a field some station carries that the read schema does not
          declare, `dropped` for a declared field no station carries.
        data_type: varchar

unit_tests:
  # Verifies TR5, TR6, TR7, TR8, TR53
  - name: stg_ambici__station_status_converts_and_renames
    description: >-
      Each station of an object is a row with its system and capture instant from the
      bronze key, its POSIX instants in UTC, `num_bikes_available` as
      `num_vehicles_available`, and null disabled counts.
    model: stg_ambici__station_status
    given:
      - input: source('ambici', 'station_status')
        format: sql
        rows: |
          select
              1792400218::bigint as last_updated,
              60 as ttl,
              '2.3' as version,
              {
                  'stations': [
                      {
                          'station_id': '1',
                          'num_bikes_available': 5,
                          'num_docks_available': 10,
                          'is_installed': true,
                          'is_renting': true,
                          'is_returning': true,
                          'last_reported': 1792400100::bigint
                      },
                      {
                          'station_id': '2',
                          'num_bikes_available': 0,
                          'num_docks_available': 3,
                          'is_installed': true,
                          'is_renting': true,
                          'is_returning': false,
                          'last_reported': 1792399800::bigint
                      }
                  ]
              } as data,
              '/work/bronze/raw/ambici/station_status/2026-10-19/20261019T085745Z.json.gz'
                  as filename
    expect:
      rows:
        - {system: ambici, station_id: "1", captured_at: "2026-10-19 08:57:45+00",
           num_vehicles_available: 5, num_docks_available: 10,
           num_vehicles_disabled: null, num_docks_disabled: null,
           is_installed: true, is_renting: true, is_returning: true,
           last_reported: "2026-10-19 08:55:00+00", last_updated: "2026-10-19 08:56:58+00"}
        - {system: ambici, station_id: "2", captured_at: "2026-10-19 08:57:45+00",
           num_vehicles_available: 0, num_docks_available: 3,
           num_vehicles_disabled: null, num_docks_disabled: null,
           is_installed: true, is_renting: true, is_returning: false,
           last_reported: "2026-10-19 08:50:00+00", last_updated: "2026-10-19 08:56:58+00"}

  # Verifies TR10
  - name: stg_ambici__station_status_keeps_counts_out_of_service
    description: >-
      An AMBici station with `is_renting` and `is_returning` false keeps its counts as
      published, since TR9's null applies to Bicing only (TR10).
    model: stg_ambici__station_status
    given:
      - input: source('ambici', 'station_status')
        format: sql
        rows: |
          select
              1792400218::bigint as last_updated,
              60 as ttl,
              '2.3' as version,
              {
                  'stations': [
                      {
                          'station_id': '7',
                          'num_bikes_available': 4,
                          'num_docks_available': 6,
                          'is_installed': true,
                          'is_renting': false,
                          'is_returning': false,
                          'last_reported': 1792400100::bigint
                      }
                  ]
              } as data,
              '/work/bronze/raw/ambici/station_status/2026-10-19/20261019T085745Z.json.gz'
                  as filename
    expect:
      rows:
        - {station_id: "7", num_vehicles_available: 4, num_docks_available: 6}

  # Verifies TR6, TR7, TR8, TR53
  - name: stg_bicing__station_status_converts
    description: >-
      Each station of an object is a row with its system and capture instant from the
      bronze key, its RFC 3339 instants in UTC with their milliseconds, and its
      disabled counts as published.
    model: stg_bicing__station_status
    given:
      - input: source('bicing', 'station_status')
        format: sql
        rows: |
          select
              '2026-10-22T07:42:19Z' as last_updated,
              0 as ttl,
              '3.0' as version,
              {
                  'stations': [
                      {
                          'station_id': '1',
                          'num_vehicles_available': 10,
                          'num_vehicles_disabled': 2,
                          'num_docks_available': 34,
                          'num_docks_disabled': 1,
                          'is_installed': true,
                          'is_renting': true,
                          'is_returning': true,
                          'last_reported': '2026-10-22T07:41:04.255Z'
                      }
                  ]
              } as data,
              '/work/bronze/raw/bicing/station_status/2026-10-22/20261022T074219Z.json.gz'
                  as filename
    expect:
      rows:
        - {system: bicing, station_id: "1", captured_at: "2026-10-22 07:42:19+00",
           num_vehicles_available: 10, num_docks_available: 34,
           num_vehicles_disabled: 2, num_docks_disabled: 1,
           is_installed: true, is_renting: true, is_returning: true,
           last_reported: "2026-10-22 07:41:04.255+00",
           last_updated: "2026-10-22 07:42:19+00"}

  # Verifies TR9, TR10
  - name: stg_bicing__station_status_nulls_vehicles_out_of_service
    description: >-
      A Bicing station with `is_renting` and `is_returning` false has null vehicles
      available (TR9); a station with only one of them false keeps its count (TR10).
    model: stg_bicing__station_status
    given:
      - input: source('bicing', 'station_status')
        format: sql
        rows: |
          select
              '2026-10-22T07:42:19Z' as last_updated,
              0 as ttl,
              '3.0' as version,
              {
                  'stations': [
                      {
                          'station_id': '245',
                          'num_vehicles_available': 3,
                          'num_vehicles_disabled': 0,
                          'num_docks_available': 0,
                          'num_docks_disabled': 0,
                          'is_installed': false,
                          'is_renting': false,
                          'is_returning': false,
                          'last_reported': '2025-10-16T06:18:25.125Z'
                      },
                      {
                          'station_id': '396',
                          'num_vehicles_available': 14,
                          'num_vehicles_disabled': 6,
                          'num_docks_available': 12,
                          'num_docks_disabled': 0,
                          'is_installed': true,
                          'is_renting': false,
                          'is_returning': true,
                          'last_reported': '2026-10-22T07:41:00.987Z'
                      }
                  ]
              } as data,
              '/work/bronze/raw/bicing/station_status/2026-10-22/20261022T074219Z.json.gz'
                  as filename
    expect:
      rows:
        - {station_id: "245", num_vehicles_available: null, num_docks_available: 0}
        - {station_id: "396", num_vehicles_available: 14, num_docks_available: 12}

  # Verifies d008 R1
  - name: station_stock_unions_both_systems
    description: >-
      Each row of both staging models is a row of the stock, with its measures and
      flags, keyed by system, station and capture instant: the same station ID and
      instant in both systems are two rows.
    model: station_stock
    given:
      - input: ref('stg_ambici__station_status')
        rows:
          - {system: ambici, station_id: "1", captured_at: "2026-10-19 08:57:45+00",
             num_vehicles_available: 5, num_docks_available: 10,
             num_vehicles_disabled: null, num_docks_disabled: null,
             is_installed: true, is_renting: true, is_returning: true,
             last_reported: "2026-10-19 08:55:00+00",
             last_updated: "2026-10-19 08:56:58+00"}
      - input: ref('stg_bicing__station_status')
        rows:
          - {system: bicing, station_id: "1", captured_at: "2026-10-19 08:57:45+00",
             num_vehicles_available: null, num_docks_available: 0,
             num_vehicles_disabled: 0, num_docks_disabled: 2,
             is_installed: false, is_renting: false, is_returning: false,
             last_reported: "2025-10-16 06:18:25.125+00",
             last_updated: "2026-10-19 08:57:40+00"}
    expect:
      rows:
        - {system: ambici, station_id: "1", captured_at: "2026-10-19 08:57:45+00",
           num_vehicles_available: 5, num_docks_available: 10,
           num_vehicles_disabled: null, num_docks_disabled: null,
           is_installed: true, is_renting: true, is_returning: true,
           last_reported: "2026-10-19 08:55:00+00",
           last_updated: "2026-10-19 08:56:58+00"}
        - {system: bicing, station_id: "1", captured_at: "2026-10-19 08:57:45+00",
           num_vehicles_available: null, num_docks_available: 0,
           num_vehicles_disabled: 0, num_docks_disabled: 2,
           is_installed: false, is_renting: false, is_returning: false,
           last_reported: "2025-10-16 06:18:25.125+00",
           last_updated: "2026-10-19 08:57:40+00"}

  # Verifies d008 R4
  - name: station_stock_keys_captures_by_local_day_and_minute
    description: >-
      A capture's local date and minute are those of `Europe/Madrid`, on both sides
      of a local midnight in summer time (UTC+2) and in standard time (UTC+1).
    model: station_stock
    given:
      - input: ref('stg_ambici__station_status')
        rows:
          - {system: ambici, station_id: "1", captured_at: "2026-07-15 21:59:00+00"}
          - {system: ambici, station_id: "1", captured_at: "2026-07-15 22:00:00+00"}
          - {system: ambici, station_id: "1", captured_at: "2026-11-19 22:59:00+00"}
          - {system: ambici, station_id: "1", captured_at: "2026-11-19 23:00:00+00"}
      - input: ref('stg_bicing__station_status')
        rows: []
    expect:
      rows:
        - {captured_at: "2026-07-15 21:59:00+00", local_date: "2026-07-15",
           local_minute: 1439}
        - {captured_at: "2026-07-15 22:00:00+00", local_date: "2026-07-16",
           local_minute: 0}
        - {captured_at: "2026-11-19 22:59:00+00", local_date: "2026-11-19",
           local_minute: 1439}
        - {captured_at: "2026-11-19 23:00:00+00", local_date: "2026-11-20",
           local_minute: 0}

  # Verifies d008 R5
  - name: station_stock_carries_run_id_and_code_version
    description: >-
      Each row carries the run's ID and code version that dbt receives as variables.
    model: station_stock
    overrides:
      vars:
        run_id: run-20261119T120000Z
        code_version: 4553811a0c9e2b7f1d3e5a6b8c0d2e4f6a8b0c1d
    given:
      - input: ref('stg_ambici__station_status')
        rows:
          - {system: ambici, station_id: "1", captured_at: "2026-10-19 08:57:45+00"}
      - input: ref('stg_bicing__station_status')
        rows:
          - {system: bicing, station_id: "1", captured_at: "2026-10-22 07:42:19+00"}
    expect:
      rows:
        - {system: ambici, run_id: run-20261119T120000Z,
           code_version: 4553811a0c9e2b7f1d3e5a6b8c0d2e4f6a8b0c1d}
        - {system: bicing, run_id: run-20261119T120000Z,
           code_version: 4553811a0c9e2b7f1d3e5a6b8c0d2e4f6a8b0c1d}

  # Verifies DQR12
  - name: capture_volume_flags_a_drop_below_90_percent_of_the_median
    description: >-
      Against a median of 237 stations, whose mean is 191, a capture of 214 is `ok`
      and one of 213 is a `drop`; the second's window holds the first, a capture of
      the batch.
    model: capture_volume
    given:
      - input: source('ambici', 'station_status')
        format: sql
        rows: |
          select
              null::bigint as last_updated,
              null::integer as ttl,
              null::varchar as version,
              {
                  'stations': (
                      select list({'station_id': i::varchar})
                      from range(214) as r (i)
                  )
              } as data,
              '/work/bronze/raw/ambici/station_status/2026-10-19/20261019T085745Z.json.gz'
                  as filename
          union all
          select
              null::bigint as last_updated,
              null::integer as ttl,
              null::varchar as version,
              {
                  'stations': (
                      select list({'station_id': i::varchar})
                      from range(213) as r (i)
                  )
              } as data,
              '/work/bronze/raw/ambici/station_status/2026-10-19/20261019T085845Z.json.gz'
                  as filename
      - input: source('bicing', 'station_status')
        format: sql
        rows: &no_bicing_objects |
          select
              null::varchar as last_updated,
              null::integer as ttl,
              null::varchar as version,
              null::struct(stations struct(station_id varchar)[]) as data,
              null::varchar as filename
          limit 0
      - input: source('lakehouse', 'capture_history')
        format: sql
        rows: |
          select
              'key-' || i::varchar as key,
              'ambici' as system,
              'station_status' as feed,
              '2026-10-19 07:57:45+00'::timestamptz + i * interval '1 minute'
                  as captured_at,
              (case when i < 20 then 100 else 237 end)::integer as station_count,
              'processed' as status,
              'run-0' as run_id,
              'check' as code_version
          from range(60) as r (i)
    expect:
      rows:
        - {system: ambici, captured_at: "2026-10-19 08:57:45+00", station_count: 214,
           captures_in_window: 60, median_station_count: 237.0, status: ok}
        - {system: ambici, captured_at: "2026-10-19 08:58:45+00", station_count: 213,
           captures_in_window: 61, median_station_count: 237.0, status: drop}

  # Verifies DQR12
  - name: capture_volume_does_not_evaluate_with_fewer_than_60_captures_in_24_h
    description: >-
      A capture with 59 captures of its system in the 24 h before it, one more being
      older, is `not_evaluated`; so is a capture whose system has none, with a null
      median, though the other system has some.
    model: capture_volume
    given:
      - input: source('ambici', 'station_status')
        format: sql
        rows: |
          select
              null::bigint as last_updated,
              null::integer as ttl,
              null::varchar as version,
              {'stations': [{'station_id': '1'}]} as data,
              '/work/bronze/raw/ambici/station_status/2026-10-19/20261019T085745Z.json.gz'
                  as filename
      - input: source('bicing', 'station_status')
        format: sql
        rows: |
          select
              null::varchar as last_updated,
              null::integer as ttl,
              null::varchar as version,
              {'stations': [{'station_id': '1'}]} as data,
              '/work/bronze/raw/bicing/station_status/2026-10-22/20261022T074219Z.json.gz'
                  as filename
      - input: source('lakehouse', 'capture_history')
        format: sql
        rows: |
          select
              'key-' || i::varchar as key,
              'ambici' as system,
              'station_status' as feed,
              '2026-10-19 07:58:45+00'::timestamptz + i * interval '1 minute'
                  as captured_at,
              237 as station_count,
              'processed' as status,
              'run-0' as run_id,
              'check' as code_version
          from range(59) as r (i)
          union all
          select
              'key-old' as key,
              'ambici' as system,
              'station_status' as feed,
              '2026-10-18 08:56:45+00'::timestamptz as captured_at,
              237 as station_count,
              'processed' as status,
              'run-0' as run_id,
              'check' as code_version
    expect:
      rows:
        - {system: ambici, captured_at: "2026-10-19 08:57:45+00",
           captures_in_window: 59, median_station_count: 237.0, status: not_evaluated}
        - {system: bicing, captured_at: "2026-10-22 07:42:19+00",
           captures_in_window: 0, median_station_count: null, status: not_evaluated}

  # Verifies DQR12
  - name: capture_volume_counts_a_capture_listing_no_station_as_0
    description: >-
      A capture whose list of stations is empty, or missing, counts 0 stations.
    model: capture_volume
    given:
      - input: source('ambici', 'station_status')
        format: sql
        rows: |
          select
              null::bigint as last_updated,
              null::integer as ttl,
              null::varchar as version,
              {
                  'stations': []::struct(station_id varchar)[]
              } as data,
              '/work/bronze/raw/ambici/station_status/2026-10-19/20261019T085745Z.json.gz'
                  as filename
          union all
          select
              null::bigint as last_updated,
