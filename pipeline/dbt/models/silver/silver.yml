  # Verifies DQR11
  - name: schema_drift_names_fields_added_and_dropped_per_object
    description: >-
      A field one station carries that the read schema does not declare is `added`
      in its object; a declared field no station of an object carries is `dropped`
      in that object.
    model: schema_drift
    overrides:
      vars:
        station_fields:
          ambici: [is_renting, num_docks_available, station_id]
          bicing: [station_id]
    given:
      - input: source('ambici', 'station_status_raw')
        format: sql
        rows: |
          select
              '{"data": {"stations": [
                  {"station_id": "1", "is_renting": true,
                   "num_docks_available": 3, "new_field": 1},
                  {"station_id": "2", "is_renting": true, "num_docks_available": 4}
              ]}}'::json as json,
              '/work/bronze/raw/ambici/station_status/2026-10-19/20261019T085745Z.json.gz'
                  as filename
          union all
          select
              '{"data": {"stations": [
                  {"station_id": "1", "is_renting": true}
              ]}}'::json as json,
              '/work/bronze/raw/ambici/station_status/2026-10-19/20261019T085845Z.json.gz'
                  as filename
      - input: source('bicing', 'station_status_raw')
        format: sql
        rows: &no_bicing_raw_objects |
          select
              null::json as json,
              null::varchar as filename
          limit 0
    expect:
      rows:
        - {system: ambici, captured_at: "2026-10-19 08:57:45+00", field: new_field,
           change: added}
        - {system: ambici, captured_at: "2026-10-19 08:58:45+00",
           field: num_docks_available, change: dropped}

  # Verifies DQR11
  - name: schema_drift_raises_none_for_a_field_some_stations_omit
    description: >-
      A declared field that only some stations of an object carry, as GBFS's optional
      fields, is neither added nor dropped.
    model: schema_drift
    overrides:
      vars:
        station_fields:
          ambici: [is_renting, num_docks_available, station_id]
          bicing: [station_id]
    given:
