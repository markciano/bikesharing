[project]
name = "bikesharing"
version = "0.1.0"
description = "Pipeline of the Barcelona bike sharing project: bronze to silver and gold, and the published file."
requires-python = ">=3.14,<3.15"
dependencies = [
    "arro3-core>=0.9.1",
    "dbt-core==1.12.7",
    "dbt-duckdb==1.11.1",
    "deltalake>=1.6.6",
    "duckdb==2.0.0",
    "jsonschema>=4.26.0",
    "obstore>=0.12.1",
]

[dependency-groups]
dev = [
    "import-linter>=2.17",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
    "sqlfluff>=4.5.0",
    "sqlfluff-templater-dbt>=4.5.0",
    "types-jsonschema>=4.26.0.20261006",
]
platform = [
    "modal>=1.6.4",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev"]
# dbt's transitive dependency; below 3.15 it truncates float model versions.
constraint-dependencies = ["mashumaro>=3.15"]

# Tests live only under tests/: without it, pytest would also collect
# scripts/smoke_test.py, whose name matches its `*_test.py` pattern, and import Modal's
# SDK, which the checks never install.
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["bikesharing"]

# Each tool starts from its default configuration: ruff's default rule set and
# mypy's standard mode. A rule or a stricter mode is added only when a bug or a
# review finding shows it would have caught something (s016 D2, Automatic
# checks).
[tool.ruff]

[tool.mypy]

# The platform group is not installed with the checks, so Modal's SDK has no stubs
# to find: only that module is left unresolved, and the rest of the platform modules
# is still type-checked (d008, Tests and CI).
[[tool.mypy.overrides]]
module = ["modal"]
ignore_missing_imports = true

# Rules 1–3 of the package's structure (ADR-0046, Functional core and imperative
# shell for the pipeline). Rules 4 and 5 are integration tests: import-linter takes
# only packages as root packages, and the platform modules are single modules.
[tool.importlinter]
root_packages = ["bikesharing"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Rule 1: the package does not import Modal's SDK"
type = "forbidden"
source_modules = ["bikesharing"]
forbidden_modules = ["modal"]

[[tool.importlinter.contracts]]
name = "Rule 2: the core imports no DuckDB, dbt or HTTP client"
type = "forbidden"
source_modules = ["bikesharing.core"]
forbidden_modules = ["duckdb", "dbt", "obstore", "requests", "httpx", "urllib3"]

[[tool.importlinter.contracts]]
name = "Rule 3: the shell sits above the core"
type = "layers"
containers = ["bikesharing"]
layers = ["shell", "core"]

[tool.sqlfluff.core]
dialect = "duckdb"
templater = "dbt"

[tool.sqlfluff.templater.dbt]
project_dir = "dbt"
profiles_dir = "dbt"

# dbt's variables, which the dbt templater takes only from here. They are
# placeholders: compiling a model needs them to render its sources, and their values
# do not change the model's SQL. The run's values come from the shell, and the
# checks' from scripts/dbt_check_vars.py (d008, Tests and CI).
[tool.sqlfluff.templater.dbt.context]
run_id = "lint"
code_version = "lint"
capture_history_file = "capture_history.parquet"
latest_captures_file = "latest_captures.parquet"

[tool.sqlfluff.templater.dbt.context.bronze_files]
ambici = ["ambici.json.gz"]
bicing = ["bicing.json.gz"]

[tool.sqlfluff.templater.dbt.context.read_columns.ambici]
data = "VARCHAR"

[tool.sqlfluff.templater.dbt.context.read_columns.bicing]
data = "VARCHAR"

[tool.sqlfluff.templater.dbt.context.station_fields]
ambici = ["station_id"]
bicing = ["station_id"]
